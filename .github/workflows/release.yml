name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Record latest tag before release
        id: pre
        run: |
          git fetch --tags
          echo "tag=$(git tag --sort=-v:refname | head -1)" >> $GITHUB_OUTPUT

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Trigger build if new release was created
        run: |
          git fetch --tags
          NEW_TAG=$(git tag --sort=-v:refname | head -1)
          if [ "$NEW_TAG" != "${{ steps.pre.outputs.tag }}" ] && [ -n "$NEW_TAG" ]; then
            echo "New release: $NEW_TAG — triggering build"
            gh api repos/${{ github.repository }}/dispatches \
              --method POST \
              -f event_type=tauri-build \
              -f "client_payload[tag]=$NEW_TAG"
          else
            echo "No new release, skipping build."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
