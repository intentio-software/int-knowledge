[workspace]
resolver = "2"
members = ["crates/int-vault", "crates/int-knowledge-mcp", "src-tauri"]

[workspace.package]
version = "1.2.0"
edition = "2021"
authors = ["Intentio Software"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
thiserror = "2"
