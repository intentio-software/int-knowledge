<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Shares the palette and rounded square of the Intentio family; the mark is
       an open book crossed by a link, for a vault of notes that reference each
       other. -->

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#062a44"/>

  <!-- Open book: two pages meeting at the spine -->
  <g fill="#ffffff">
    <path d="M256 168 C 210 138, 152 132, 104 144 L 104 356 C 152 344, 210 350, 256 380 Z"/>
    <path d="M256 168 C 302 138, 360 132, 408 144 L 408 356 C 360 344, 302 350, 256 380 Z"/>
  </g>

  <!-- Lines of writing -->
  <g stroke="#94a9bd" stroke-width="13" stroke-linecap="round">
    <line x1="144" y1="205" x2="222" y2="212"/>
    <line x1="144" y1="252" x2="222" y2="259"/>
    <line x1="290" y1="212" x2="368" y2="205"/>
    <line x1="290" y1="259" x2="368" y2="252"/>
  </g>

  <!-- The spine is a gap rather than a stroke, so it does not cross the link
       below and read as a plus sign. -->
  <line x1="256" y1="164" x2="256" y2="384" stroke="#062a44" stroke-width="16" stroke-linecap="round"/>

  <!-- The link: one note pointing at another, straight across the spine -->
  <line x1="172" y1="309" x2="340" y2="309" stroke="#f05f36" stroke-width="14" stroke-linecap="round"/>
  <g fill="#062a44" stroke="#f05f36" stroke-width="12">
    <circle cx="172" cy="309" r="21"/>
    <circle cx="340" cy="309" r="21"/>
  </g>
</svg>
